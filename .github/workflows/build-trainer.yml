name: Build trainer EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'oot_longshot_trainer.py'
      - '.github/workflows/build-trainer.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build EXE
        run: pyinstaller --onefile --noconsole --name oot_longshot_trainer oot_longshot_trainer.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: oot_longshot_trainer-windows
          path: dist/oot_longshot_trainer.exe
